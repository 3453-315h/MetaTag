name: Native CI (C++)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.7.3'
        cache: true

    - name: Install TagLib via vcpkg
      run: |
        vcpkg install taglib:x64-windows

    - name: Configure CMake
      run: |
        cmake -B build `
          -DCMAKE_BUILD_TYPE=Release `
          -DBUILD_TESTS=ON `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
      shell: pwsh

    - name: Build
      run: cmake --build build --config Release

    - name: Test
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        $qtBin = "$env:Qt6_DIR\bin"
        $vcpkgBin = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin"
        $testDir = "build\tests\Release"
        $env:PATH = "$qtBin;$vcpkgBin;$testDir;$env:PATH"
        ctest --test-dir build -C Release --output-on-failure --no-tests=error
      shell: pwsh